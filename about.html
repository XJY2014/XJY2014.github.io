<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于我</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:system-ui, sans-serif;
        }
        body{
            background-color:#e8f2ff;
            color:#003366;
            /* 页面淡入效果 */
            animation: fadeIn 0.8s ease-in-out;
            min-height:100vh;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            padding:20px;
        }
        @keyframes fadeIn{
            from{opacity:0;}
            to{opacity:1;}
        }
        .box{
            background:#ffffff;
            padding:35px;
            border-radius:16px;
            box-shadow: 0 4px 12px #b8d8ff;
            text-align:center;
        }
        h1{
            color:#0055aa;
            margin-bottom:16px;
        }
        p{
            font-size:17px;
            margin-bottom:28px;
            line-height:1.6;
        }
        .btn{
            display:block;
            width:220px;
            margin:12px auto;
            padding:14px;
            background:#0066cc;
            color:white;
            border:none;
            border-radius:10px;
            font-size:16px;
            cursor:pointer;
            text-decoration:none;
            transition: 0.3s;
        }
        .btn:hover{
            background:#004d99;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>关于我</h1>
        <p>你好！我是谢嘉裕，喜欢编程，乐于探索网页制作。</p>
        <a href="./index.html" class="btn">返回主页</a>
        <a href="./game.html" class="btn">猜数字游戏</a>
    </div>
</body>
</html>
