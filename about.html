<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于我</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui;}
        body{
            background: linear-gradient(135deg, #2563eb, #60a5fa);
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:20px;
        }
        .card{
            background:#fff;
            border-radius:20px;
            padding:30px;
            max-width:420px;
            width:100%;
            text-align:center;
        }
        h2{color:#1e40af;margin-bottom:16px;}
        p{color:#333;line-height:1.7;font-size:16px;margin-bottom:12px;}
        .avatar{
            width:140px;
            height:140px;
            border-radius:50%;
            object-fit:cover;
            border:4px solid #93c5fd;
            margin-bottom:16px;
        }
        .btn{
            width:100%;
            background:#3b82f6;
            color:white;
            padding:14px;
            border-radius:12px;
            border:none;
            font-size:17px;
            margin:8px 0;
            transition:0.2s;
            cursor:pointer;
        }
        .btn:hover{background:#1d4ed8;transform:scale(1.02);}
        .back-home{
            background:#64748b;
        }
        .game-btn{
            background:#059669;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- 这里src改成你的头像文件名，比如 src="avatar.jpg" -->
        <img class="avatar" src="avatar.jpg" alt="头像">
        <h2>谢嘉裕</h2>
        <p>热爱编程，喜欢写有趣的小网页程序</p>

        <!-- 返回主页（同仓库，短链接） -->
        <a href="index.html">
            <button class="btn back-home">🏠 返回主页</button>
        </a>
        <a href="https://XJY2014.github.io/game/game.html">
            <button class="btn game-btn">🎮 猜数字游戏</button>
        </a>

    </div>
</body>
</html>
