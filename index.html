<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的第一个网页</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;
        }
        body{
            background-color: #f0f8ff;
            font-family: system-ui;
            text-align:center;
            padding: 60px 20px;
        }
        .box{
            background:white;
            max-width:500px;
            margin:0 auto;
            padding:40px;
            border-radius:16px;
            box-shadow: 0 4px 12px #00000015;
        }
        h1{
            color:#2b549c;
            margin-bottom:20px;
        }
        p{
            color:#555;
            font-size:18px;
            line-height:1.6;
        }
        .btn{
            display:inline-block;
            margin-top:25px;
            padding:12px 28px;
            background:#407bdd;
            color:white;
            text-decoration:none;
            border-radius:30px;
        }
        .btn:hover{
            background:#2b549c;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>欢迎来到我的网页✨</h1>
        <p>这是我用GitHub Pages搭建的网站</p>
        <p>可以修改这里的文字，换成你喜欢的内容</p>
        <a class="btn" href="#">点我试试</a>
    </div>
</body>
</html>
